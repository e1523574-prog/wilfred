<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Books | ICEB Multimedia</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        background: #f5f5f5;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      .books-container {
        max-width: 1000px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
      }

      .book {
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      .book h2 {
        margin-bottom: 20px;
      }

      .read-btn {
        display: inline-block;
        padding: 12px 25px;
        background: #0066cc;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }

      .read-btn:hover {
        background: #004c99;
      }
    </style>
  </head>

  <body>
    <h1>Our Books</h1>

    <div class="books-container">
      <div class="book">
        <h2>END OF SEM EXAM PRACTICAL.pdf</h2>
        <a
          href="BOOKS/COMPRESSED/5240320042 WILFRED NARTEY ADDO END OF SEM EXAM PRACTICAL.pdf"
          target="_blank"
          class="read-btn"
        >
          Read Book
        </a>
      </div>

      <div class="book">
        <h2>A4 HANDBOOK VIDA..pdf</h2>
        <a
          href="BOOKS/COMPRESSED/A4 HANDBOOK VIDA..pdf"
          target="_blank"
          class="read-btn"
        >
          Read Book
        </a>
      </div>

      <div class="book">
        <h2>MRS. JOSEPHINE.pdf</h2>
        <a
          href="BOOKS/COMPRESSED/MRS. JOSEPHINE.pdf"
          target="_blank"
          class="read-btn"
        >
          Read Book
        </a>
      </div>

      <div class="book">
        <h2>My Portfolio</h2>
        <a
          href="BOOKS/COMPRESSED/MY PORTFOLIO_compressed.pdf"
          target="_blank"
          class="read-btn"
        >
          Read Book
        </a>
      </div>

      <div class="book">
        <h2>READY TO FILE.pdf</h2>
        <a
          href="BOOKS/COMPRESSED/READY TO FILE.pdf"
          target="_blank"
          class="read-btn"
        >
          Read Book
        </a>
      </div>
    </div>
  </body>
</html>
