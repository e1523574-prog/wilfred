<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | iCEB Multimedia</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/responsive.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <h2>iCEB</h2>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>

          <li><a href="about.html">About</a></li>

          <li><a href="services.html">Services</a></li>

          <li><a href="portfolio.html">Portfolio</a></li>

          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>

        <a href="#" class="btn"> Book Now </a>
      </nav>
    </header>

    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>

        <p>Let's discuss your next creative project.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-info">
            <h2>Get In Touch</h2>

            <p>We'd love to hear from you.</p>

            <div class="contact-item">
              <i class="fas fa-phone"></i>

              <span>+233 59 338 1059</span>
            </div>

            <div class="contact-item">
              <i class="fas fa-envelope"></i>

              <span>addowilfrednart@gmail.com</span>
            </div>

            <div class="contact-item">
              <i class="fas fa-location-dot"></i>

              <span>Accra, Ghana</span>
            </div>

            <div class="contact-item">
              <i class="fab fa-whatsapp"></i>

              <span>WhatsApp Available</span>
            </div>
          </div>

          <div class="contact-form">
            <form>
              <input type="text" placeholder="Full Name" required />

              <input type="email" placeholder="Email Address" required />

              <input type="text" placeholder="Subject" />

              <textarea rows="6" placeholder="Your Message"></textarea>

              <button class="btn" type="submit">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="map">
      <iframe
        src="https://www.google.com/maps?q=Accra,Ghana&output=embed"
        allowfullscreen
        loading="lazy"
      >
      </iframe>
    </section>

    <footer class="footer">
      <div class="container">
        <p>© 2026 iCEB Multimedia</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
